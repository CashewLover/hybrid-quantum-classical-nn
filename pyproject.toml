[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_qml"
version = "0.1.0"
description = "Does the Quantum Layer Matter? An Entanglement-Ablation Study of a Hybrid Quantum-Classical Neural Network"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Saeid Khonji" }]
dependencies = [
    "torch>=2.6,<3.0",
    "pennylane>=0.45,<1.0",
    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.10,<4.0",
    "pillow>=11.0,<14.0",
]

[project.scripts]
hybrid-qml = "hybrid_qml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
